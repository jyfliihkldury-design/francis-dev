<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Francis Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
        }

        header {
            background: #1e293b;
            padding: 20px;
            text-align: center;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: #38bdf8;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: white;
        }

        .hero {
            padding: 80px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            color: #cbd5e1;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #38bdf8;
            color: black;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: white;
        }

        footer {
            background: #1e293b;
            padding: 20px;
            text-align: center;
            margin-top: 50px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<header>
    <h2>Francis Dev</h2>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome to My Website 🚀</h1>
    <p>I am learning web development using HTML & CSS.</p>
    <a href="#" class="btn">Get Started</a>
</section>

<footer>
    <p>© 2026 Francis Mumba | All Rights Reserved</p>
</footer>

</body>
</html>
